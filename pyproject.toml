[project]
name = "seoul-commerce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SeungHwan Kim", email = "scksh1204@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "interpret-core>=0.7.8",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.61.1",
    "streamlit-folium>=0.27.4",
    "tqdm>=4.67.1",
    "xmltodict>=1.0.4",
]

[tool.uv]
cache-dir = ".uv-cache-codex"

[project.scripts]
seoul-commerce = "seoul_commerce.collector:main"
seoul-commerce-korean = "seoul_commerce.column_translator:main"
seoul-commerce-preprocess = "seoul_commerce.preprocessing:main"
seoul-commerce-build-marts = "seoul_commerce.analysis_mart:main"
seoul-commerce-train-ebm = "seoul_commerce.modeling:main"
seoul-commerce-korean-marts = "seoul_commerce.mart_translator:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
