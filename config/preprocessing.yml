schema_version: "1.0.0"

analysis_scope:
  quarter_min: "20211"
  quarter_max: "20261"
  industry_codes:
    - CS100001
    - CS100002
    - CS100003
    - CS100004
    - CS100005
    - CS100006
    - CS100007
    - CS100008
    - CS100009
    - CS100010

paths:
  input_dir: data/raw
  english_output_dir: data/analysis/english
  korean_output_dir: data/analysis/korean
  analysis_schema: config/analysis_schema.yml
  analysis_column_mapping_ko: config/analysis_column_mapping_ko.yml

common_source_columns:
  STDR_YYQU_CD: quarter_code
  TRDAR_SE_CD: trade_area_type_code
  TRDAR_SE_CD_NM: trade_area_type_name
  TRDAR_CD: trade_area_code
  TRDAR_CD_NM: trade_area_name
  SOURCE_BASE_DATE: source_base_date

source_datasets:
  trade_area:
    filename: trade_area.csv
    primary_key: [trade_area_code]
    columns:
      TRDAR_SE_CD: trade_area_type_code
      TRDAR_SE_CD_NM: trade_area_type_name
      TRDAR_CD: trade_area_code
      TRDAR_CD_NM: trade_area_name
      XCNTS_VALUE: x_epsg5181
      YDNTS_VALUE: y_epsg5181
      SIGNGU_CD: district_code
      SIGNGU_CD_NM: district_name
      ADSTRD_CD: admin_dong_code
      ADSTRD_CD_NM: admin_dong_name
      RELM_AR: area_sqm
      SOURCE_BASE_DATE: source_base_date

  stores:
    filename: stores.csv
    primary_key: [quarter_code, trade_area_code, industry_code]
    use_common_columns: true
    industry_filtered: true
    columns:
      SVC_INDUTY_CD: industry_code
      SVC_INDUTY_CD_NM: industry_name
      SIMILR_INDUTY_STOR_CO: total_store_count
      STOR_CO: general_store_count
      FRC_STOR_CO: franchise_store_count
      OPBIZ_STOR_CO: opened_store_count
      OPBIZ_RT: open_rate
      CLSBIZ_STOR_CO: closed_store_count
      CLSBIZ_RT: close_rate

  sales:
    filename: sales.csv
    primary_key: [quarter_code, trade_area_code, industry_code]
    use_common_columns: true
    industry_filtered: true
    columns:
      SVC_INDUTY_CD: industry_code
      SVC_INDUTY_CD_NM: industry_name
      THSMON_SELNG_AMT: quarterly_sales_amount
      THSMON_SELNG_CO: quarterly_sales_count
      MDWK_SELNG_AMT: weekday_sales_amount
      WKEND_SELNG_AMT: weekend_sales_amount
      MDWK_SELNG_CO: weekday_sales_count
      WKEND_SELNG_CO: weekend_sales_count
      MON_SELNG_AMT: monday_sales_amount
      TUES_SELNG_AMT: tuesday_sales_amount
      WED_SELNG_AMT: wednesday_sales_amount
      THUR_SELNG_AMT: thursday_sales_amount
      FRI_SELNG_AMT: friday_sales_amount
      SAT_SELNG_AMT: saturday_sales_amount
      SUN_SELNG_AMT: sunday_sales_amount
      MON_SELNG_CO: monday_sales_count
      TUES_SELNG_CO: tuesday_sales_count
      WED_SELNG_CO: wednesday_sales_count
      THUR_SELNG_CO: thursday_sales_count
      FRI_SELNG_CO: friday_sales_count
      SAT_SELNG_CO: saturday_sales_count
      SUN_SELNG_CO: sunday_sales_count
      TMZON_00_06_SELNG_AMT: time_00_06_sales_amount
      TMZON_06_11_SELNG_AMT: time_06_11_sales_amount
      TMZON_11_14_SELNG_AMT: time_11_14_sales_amount
      TMZON_14_17_SELNG_AMT: time_14_17_sales_amount
      TMZON_17_21_SELNG_AMT: time_17_21_sales_amount
      TMZON_21_24_SELNG_AMT: time_21_24_sales_amount
      TMZON_00_06_SELNG_CO: time_00_06_sales_count
      TMZON_06_11_SELNG_CO: time_06_11_sales_count
      TMZON_11_14_SELNG_CO: time_11_14_sales_count
      TMZON_14_17_SELNG_CO: time_14_17_sales_count
      TMZON_17_21_SELNG_CO: time_17_21_sales_count
      TMZON_21_24_SELNG_CO: time_21_24_sales_count
      ML_SELNG_AMT: male_sales_amount
      FML_SELNG_AMT: female_sales_amount
      ML_SELNG_CO: male_sales_count
      FML_SELNG_CO: female_sales_count
      AGRDE_10_SELNG_AMT: age_10_sales_amount
      AGRDE_20_SELNG_AMT: age_20_sales_amount
      AGRDE_30_SELNG_AMT: age_30_sales_amount
      AGRDE_40_SELNG_AMT: age_40_sales_amount
      AGRDE_50_SELNG_AMT: age_50_sales_amount
      AGRDE_60_ABOVE_SELNG_AMT: age_60_plus_sales_amount
      AGRDE_10_SELNG_CO: age_10_sales_count
      AGRDE_20_SELNG_CO: age_20_sales_count
      AGRDE_30_SELNG_CO: age_30_sales_count
      AGRDE_40_SELNG_CO: age_40_sales_count
      AGRDE_50_SELNG_CO: age_50_sales_count
      AGRDE_60_ABOVE_SELNG_CO: age_60_plus_sales_count

  floating_population:
    filename: floating_population.csv
    primary_key: [quarter_code, trade_area_code]
    use_common_columns: true
    columns:
      TOT_FLPOP_CO: total_floating_population
      ML_FLPOP_CO: male_floating_population
      FML_FLPOP_CO: female_floating_population
      AGRDE_10_FLPOP_CO: age_10_floating_population
      AGRDE_20_FLPOP_CO: age_20_floating_population
      AGRDE_30_FLPOP_CO: age_30_floating_population
      AGRDE_40_FLPOP_CO: age_40_floating_population
      AGRDE_50_FLPOP_CO: age_50_floating_population
      AGRDE_60_ABOVE_FLPOP_CO: age_60_plus_floating_population
      MON_FLPOP_CO: monday_floating_population
      TUES_FLPOP_CO: tuesday_floating_population
      WED_FLPOP_CO: wednesday_floating_population
      THUR_FLPOP_CO: thursday_floating_population
      FRI_FLPOP_CO: friday_floating_population
      SAT_FLPOP_CO: saturday_floating_population
      SUN_FLPOP_CO: sunday_floating_population
      TMZON_00_06_FLPOP_CO: time_00_06_floating_population
      TMZON_06_11_FLPOP_CO: time_06_11_floating_population
      TMZON_11_14_FLPOP_CO: time_11_14_floating_population
      TMZON_14_17_FLPOP_CO: time_14_17_floating_population
      TMZON_17_21_FLPOP_CO: time_17_21_floating_population
      TMZON_21_24_FLPOP_CO: time_21_24_floating_population

  resident_population:
    filename: resident_population.csv
    primary_key: [quarter_code, trade_area_code]
    use_common_columns: true
    columns:
      TOT_REPOP_CO: total_resident_population
      ML_REPOP_CO: male_resident_population
      FML_REPOP_CO: female_resident_population
      AGRDE_10_REPOP_CO: age_10_resident_population
      AGRDE_20_REPOP_CO: age_20_resident_population
      AGRDE_30_REPOP_CO: age_30_resident_population
      AGRDE_40_REPOP_CO: age_40_resident_population
      AGRDE_50_REPOP_CO: age_50_resident_population
      AGRDE_60_ABOVE_REPOP_CO: age_60_plus_resident_population
      MAG_10_REPOP_CO: male_age_10_resident_population
      MAG_20_REPOP_CO: male_age_20_resident_population
      MAG_30_REPOP_CO: male_age_30_resident_population
      MAG_40_REPOP_CO: male_age_40_resident_population
      MAG_50_REPOP_CO: male_age_50_resident_population
      MAG_60_ABOVE_REPOP_CO: male_age_60_plus_resident_population
      FAG_10_REPOP_CO: female_age_10_resident_population
      FAG_20_REPOP_CO: female_age_20_resident_population
      FAG_30_REPOP_CO: female_age_30_resident_population
      FAG_40_REPOP_CO: female_age_40_resident_population
      FAG_50_REPOP_CO: female_age_50_resident_population
      FAG_60_ABOVE_REPOP_CO: female_age_60_plus_resident_population
      TOT_HSHLD_CO: total_household_count
      APT_HSHLD_CO: apartment_household_count
      NON_APT_HSHLD_CO: non_apartment_household_count

  working_population:
    filename: working_population.csv
    primary_key: [quarter_code, trade_area_code]
    use_common_columns: true
    columns:
      TOT_WRC_POPLTN_CO: total_working_population
      ML_WRC_POPLTN_CO: male_working_population
      FML_WRC_POPLTN_CO: female_working_population
      AGRDE_10_WRC_POPLTN_CO: age_10_working_population
      AGRDE_20_WRC_POPLTN_CO: age_20_working_population
      AGRDE_30_WRC_POPLTN_CO: age_30_working_population
      AGRDE_40_WRC_POPLTN_CO: age_40_working_population
      AGRDE_50_WRC_POPLTN_CO: age_50_working_population
      AGRDE_60_ABOVE_WRC_POPLTN_CO: age_60_plus_working_population
      MAG_10_WRC_POPLTN_CO: male_age_10_working_population
      MAG_20_WRC_POPLTN_CO: male_age_20_working_population
      MAG_30_WRC_POPLTN_CO: male_age_30_working_population
      MAG_40_WRC_POPLTN_CO: male_age_40_working_population
      MAG_50_WRC_POPLTN_CO: male_age_50_working_population
      MAG_60_ABOVE_WRC_POPLTN_CO: male_age_60_plus_working_population
      FAG_10_WRC_POPLTN_CO: female_age_10_working_population
      FAG_20_WRC_POPLTN_CO: female_age_20_working_population
      FAG_30_WRC_POPLTN_CO: female_age_30_working_population
      FAG_40_WRC_POPLTN_CO: female_age_40_working_population
      FAG_50_WRC_POPLTN_CO: female_age_50_working_population
      FAG_60_ABOVE_WRC_POPLTN_CO: female_age_60_plus_working_population

  facilities:
    filename: facilities.csv
    primary_key: [quarter_code, trade_area_code]
    use_common_columns: true
    columns:
      VIATR_FCLTY_CO: total_facility_count
      PBLOFC_CO: public_office_count
      BANK_CO: bank_count
      GEHSPT_CO: general_hospital_count
      GNRL_HSPTL_CO: hospital_count
      PARMACY_CO: pharmacy_count
      KNDRGR_CO: kindergarten_count
      ELESCH_CO: elementary_school_count
      MSKUL_CO: middle_school_count
      HGSCHL_CO: high_school_count
      UNIV_CO: university_count
      DRTS_CO: department_store_count
      SUPMK_CO: supermarket_count
      THEAT_CO: theater_count
      STAYNG_FCLTY_CO: accommodation_count
      ARPRT_CO: airport_count
      RLROAD_STATN_CO: railway_station_count
      BUS_TRMINL_CO: bus_terminal_count
      SUBWAY_STATN_CO: subway_station_count
      BUS_STTN_CO: bus_stop_count

outputs:
  trade_area_master:
    english_filename: trade_area_master.csv
    korean_filename: 상권_기준정보.csv
  area_quarter:
    english_filename: area_quarter.csv
    korean_filename: 상권_분기_데이터.csv
  commercial_quarter:
    english_filename: commercial_quarter.csv
    korean_filename: 상권_업종_분석데이터.csv
  segment_comparison:
    english_filename: segment_comparison.csv
    korean_filename: 구성비_비교데이터.csv
  data_quality:
    english_filename: data_quality.csv
    korean_filename: 데이터_품질.csv

canonical_trade_area_names:
  "3110024": 혜화동주민센터
  "3110379": KTNG 북부지사

segments:
  gender:
    - {code: male, name: 남성, sales_amount_column: male_sales_amount, sales_count_column: male_sales_count, floating_column: male_floating_population}
    - {code: female, name: 여성, sales_amount_column: female_sales_amount, sales_count_column: female_sales_count, floating_column: female_floating_population}
  age:
    - {code: "10", name: 10대, sales_amount_column: age_10_sales_amount, sales_count_column: age_10_sales_count, floating_column: age_10_floating_population}
    - {code: "20", name: 20대, sales_amount_column: age_20_sales_amount, sales_count_column: age_20_sales_count, floating_column: age_20_floating_population}
    - {code: "30", name: 30대, sales_amount_column: age_30_sales_amount, sales_count_column: age_30_sales_count, floating_column: age_30_floating_population}
    - {code: "40", name: 40대, sales_amount_column: age_40_sales_amount, sales_count_column: age_40_sales_count, floating_column: age_40_floating_population}
    - {code: "50", name: 50대, sales_amount_column: age_50_sales_amount, sales_count_column: age_50_sales_count, floating_column: age_50_floating_population}
    - {code: 60_plus, name: 60대 이상, sales_amount_column: age_60_plus_sales_amount, sales_count_column: age_60_plus_sales_count, floating_column: age_60_plus_floating_population}
  weekday:
    - {code: mon, name: 월요일, sales_amount_column: monday_sales_amount, sales_count_column: monday_sales_count, floating_column: monday_floating_population}
    - {code: tue, name: 화요일, sales_amount_column: tuesday_sales_amount, sales_count_column: tuesday_sales_count, floating_column: tuesday_floating_population}
    - {code: wed, name: 수요일, sales_amount_column: wednesday_sales_amount, sales_count_column: wednesday_sales_count, floating_column: wednesday_floating_population}
    - {code: thu, name: 목요일, sales_amount_column: thursday_sales_amount, sales_count_column: thursday_sales_count, floating_column: thursday_floating_population}
    - {code: fri, name: 금요일, sales_amount_column: friday_sales_amount, sales_count_column: friday_sales_count, floating_column: friday_floating_population}
    - {code: sat, name: 토요일, sales_amount_column: saturday_sales_amount, sales_count_column: saturday_sales_count, floating_column: saturday_floating_population}
    - {code: sun, name: 일요일, sales_amount_column: sunday_sales_amount, sales_count_column: sunday_sales_count, floating_column: sunday_floating_population}
  time_band:
    - {code: "00_06", name: "00~06시", sales_amount_column: time_00_06_sales_amount, sales_count_column: time_00_06_sales_count, floating_column: time_00_06_floating_population}
    - {code: "06_11", name: "06~11시", sales_amount_column: time_06_11_sales_amount, sales_count_column: time_06_11_sales_count, floating_column: time_06_11_floating_population}
    - {code: "11_14", name: "11~14시", sales_amount_column: time_11_14_sales_amount, sales_count_column: time_11_14_sales_count, floating_column: time_11_14_floating_population}
    - {code: "14_17", name: "14~17시", sales_amount_column: time_14_17_sales_amount, sales_count_column: time_14_17_sales_count, floating_column: time_14_17_floating_population}
    - {code: "17_21", name: "17~21시", sales_amount_column: time_17_21_sales_amount, sales_count_column: time_17_21_sales_count, floating_column: time_17_21_floating_population}
    - {code: "21_24", name: "21~24시", sales_amount_column: time_21_24_sales_amount, sales_count_column: time_21_24_sales_count, floating_column: time_21_24_floating_population}
